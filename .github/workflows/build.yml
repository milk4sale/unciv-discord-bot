name: Build & self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('setup.sh', 'bot/build.gradle.kts') }}
      - name: Setup (fetch Unciv, patch, build)
        run: ./setup.sh
      - name: Offline self-test (plays a game, checks every feature)
        run: |
          ./run.sh --selftest | tee selftest.log
          grep -q "^Errors: 0" selftest.log
      - name: Upload panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-panels
          path: selftest-out/*.png

  windows:
    # Real Windows: the double-click scripts, both ways of downloading Unciv, a folder name with
    # spaces, the self-test and the background task.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        download: [git, zip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-win-${{ hashFiles('scripts/windows/setup.ps1', 'bot/build.gradle.kts') }}
      - name: Copy into a folder with spaces (zip variant)
        if: matrix.download == 'zip'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Civ Bot Test'
          Copy-Item -Recurse $env:GITHUB_WORKSPACE $dest
          Remove-Item -Recurse -Force (Join-Path $dest '.git')
          "CIVBOT_DIR=$dest" >> $env:GITHUB_ENV
          "CIVBOT_NO_GIT=1" >> $env:GITHUB_ENV
      - name: Pick the folder (git variant)
        if: matrix.download == 'git'
        shell: pwsh
        run: '"CIVBOT_DIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV'
      - name: setup.cmd
        shell: cmd
        run: |
          cd /d "%CIVBOT_DIR%"
          call setup.cmd
      - name: setup.cmd again (re-run must be safe)
        shell: cmd
        run: |
          cd /d "%CIVBOT_DIR%"
          call setup.cmd
      - name: run.cmd --selftest
        shell: pwsh
        run: |
          Set-Location $env:CIVBOT_DIR
          cmd /c "run.cmd --selftest" | Tee-Object selftest.log
          if (-not (Select-String -Path selftest.log -Pattern '^Errors: 0' -Quiet)) { exit 1 }
          exit 0
      - name: Background task install and remove
        if: matrix.download == 'git'
        shell: pwsh
        run: |
          Set-Location $env:CIVBOT_DIR
          "DISCORD_TOKEN=not-a-real-token" | Set-Content .env
          cmd /c "scripts\windows\install-service.cmd"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ScheduledTask -TaskName CivBot | Format-List TaskName, State
          # The runner's system-wide JAVA_HOME is an older Java: the task must still use the Java 21 setup found
          Start-Sleep -Seconds 45
          $log = (Get-Content civbot.log, civbot-error.log -ErrorAction SilentlyContinue) -join "`n"
          $log.Split("`n") | Select-Object -Last 20
          cmd /c "scripts\windows\install-service.cmd -Remove"
          if (Get-ScheduledTask -TaskName CivBot -ErrorAction SilentlyContinue) { exit 1 }
          if ($log -notmatch 'Unciv engine ready') { Write-Host 'The bot did not start in the background task'; exit 1 }
          exit 0
      - name: Upload panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-panels-windows-${{ matrix.download }}
          path: ${{ env.CIVBOT_DIR }}/selftest-out/*.png
